# AGAP Emergency Response Platform — Development Docker Compose
# For production, use docker-compose.prod.yml

services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: agap_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: agap_user
      POSTGRES_PASSWORD: agap_password
      POSTGRES_DB: agap_db
    ports:
      - "5461:5432"
    volumes:
      - agap_postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agap_user -d agap_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: agap_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    ports:
      - "6382:6379"
    volumes:
      - agap_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: development
    container_name: agap_backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://agap_user:agap_password@postgres:5432/agap_db?schema=public
      REDIS_URL: redis://redis:6379
    ports:
      - "3002:3000"
    volumes:
      - .:/app
      - agap_node_modules:/app/node_modules
      - agap_backend_node_modules:/app/backend/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  minio:
    build:
      context: ./infrastructure/minio
      dockerfile: Dockerfile
    container_name: agap_minio
    restart: unless-stopped
    ports:
      - "9000:9000"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  agap_postgres_data:
  agap_redis_data:
  agap_node_modules:
  agap_backend_node_modules:
  minio_data:

networks:
  default:
    name: agap_network
