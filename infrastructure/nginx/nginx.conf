# ============================================================================
# AGAP Emergency Response Platform — Edge reverse proxy (production)
# ----------------------------------------------------------------------------
# Routes the three surfaces behind one origin so passkeys (which require the RP
# to own /.well-known/*) and the Socket.io realtime channel work over TLS:
#
#   /.well-known/*   → backend  (WebAuthn assetlinks.json / apple-app-site-
#                                association — version-neutral, NO /v1 prefix)
#   /socket.io/*     → backend  (MOD-20 realtime; the "/agap" Socket.io
#                                namespace rides this transport path — needs the
#                                HTTP Upgrade dance)
#   /v1/*            → backend  (REST API — URI versioning, see main.ts)
#   /api/*           → backend  (Swagger UI at /api/docs, non-prod)
#   /health          → backend  (liveness)
#   /*               → frontend (Next.js Operations Center / Hospital Portal)
#
# TLS termination is expected to be handled here in production; add the
# `listen 443 ssl;` server and certificates via your deployment's secret mount.
# ============================================================================

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile      on;
  tcp_nopush    on;
  server_tokens off;

  # Incident photos / evidence can be a few MB (MOD-10).
  client_max_body_size 25m;

  gzip              on;
  gzip_comp_level   5;
  gzip_min_length   256;
  gzip_proxied      any;
  gzip_types        application/json application/javascript text/css text/plain
                    application/xml image/svg+xml;

  # Socket.io upgrades from HTTP to WebSocket; map the Connection header so
  # polling fallback (no Upgrade) still works.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # Docker embedded DNS. Using a variable in proxy_pass + resolver means nginx
  # starts even when a backing service is briefly unresolvable (returns 502 at
  # request time instead of refusing to boot).
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Common proxy headers.
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_http_version 1.1;

  server {
    listen 80;
    server_name _;

    # --- Passkeys: RP must serve these from its own origin, un-versioned ------
    location /.well-known/ {
      set $backend_upstream http://backend:3000;
      proxy_pass $backend_upstream;
    }

    # --- Realtime (Socket.io / MOD-20, "/agap" namespace) ---------------------
    location /socket.io/ {
      set $backend_upstream http://backend:3000;
      proxy_pass $backend_upstream;
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s;   # keep long-lived WS connections open
      proxy_send_timeout 3600s;
    }

    # --- REST API (URI versioning) --------------------------------------------
    location /v1/ {
      set $backend_upstream http://backend:3000;
      proxy_pass $backend_upstream;
    }

    # --- Swagger / OpenAPI (non-prod) -----------------------------------------
    location /api/ {
      set $backend_upstream http://backend:3000;
      proxy_pass $backend_upstream;
    }

    # --- Liveness -------------------------------------------------------------
    location = /health {
      set $backend_upstream http://backend:3000;
      proxy_pass $backend_upstream;
    }

    # --- Operations Center / Hospital Portal (Next.js) ------------------------
    location / {
      set $frontend_upstream http://frontend:3001;
      proxy_pass $frontend_upstream;
      proxy_set_header Upgrade    $http_upgrade;   # Next.js HMR / RSC streaming
      proxy_set_header Connection $connection_upgrade;
    }
  }
}
