packages:
  - "backend"
  - "frontend"
  - "mobile"
  - "shared"
  - "tests"
allowBuilds:
  '@firebase/util': true
  # Ships prebuilt (dist/); its only install script is a no-op echo.
  '@google/genai': false
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  msgpackr-extract: true
  # CPU binaries (win32, linux glibc, darwin) ship in the package; the install script only downloads
  # optional CUDA GPU files. Used by the on-server profile photo check (@huggingface/transformers).
  onnxruntime-node: false
  prisma: true
  protobufjs: true
  # Uses its prebuilt @img/sharp-<platform> binary (Windows and Alpine/musl included); the install script
  # only builds from source when a global libvips or --build-from-source is present.
  sharp: false
  # Its only install script is opencollective-postinstall (a donation banner).
  tesseract.js: false
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@expo/cli@57.0.31'
  - '@expo/router-server@57.0.13'
  - babel-preset-expo@57.0.16
  - expo@57.0.30
  - '@expo/ui@57.0.25'
  - expo-router@57.0.28
overrides:
  '@types/react': ^18.3.0
  '@types/react-dom': ^18.3.0
