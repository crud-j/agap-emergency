packages:
  - "backend"
  - "frontend"
  - "mobile"
  - "shared"
  - "tests"
allowBuilds:
  '@firebase/util': true
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  msgpackr-extract: true
  prisma: true
  protobufjs: true
  unrs-resolver: true
overrides:
  '@types/react': ^18.3.0
  '@types/react-dom': ^18.3.0
