# AGAP Emergency Response Platform — Production Docker Compose
# Requires external secrets management. Do NOT commit .env with real secrets.

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: agap_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - agap_postgres_data:/var/lib/postgresql/data
      # Enable PostGIS + uuid-ossp on first init (MOD-22/26/30/51 spatial queries).
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: agap_redis_prod
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - agap_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: agap-backend:latest
    container_name: agap_backend_prod
    restart: always
    environment:
      NODE_ENV: production
    env_file:
      - .env.prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Edge reverse proxy — terminates the public origin and routes /.well-known/*
  # (passkeys), /socket.io/* (realtime, the "/agap" namespace), /v1 + /api
  # (backend) and everything else to the Next.js frontend. See
  # infrastructure/nginx/nginx.conf. Mount TLS certs and add a 443 server for
  # production HTTPS.
  nginx:
    image: nginx:1.27-alpine
    container_name: agap_nginx_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend

volumes:
  agap_postgres_data:
  agap_redis_data:
